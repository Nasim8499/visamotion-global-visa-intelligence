<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232543e6'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/%3E%3C/svg%3E" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2543E6" />
<title>Visamotion - Global Visa Intelligence</title>
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:Inter,system-ui,sans-serif}
  #vm-boot{position:fixed;inset:0;display:grid;place-items:center;background:#fff;color:#0b1220;z-index:9999}
  #vm-boot .b{text-align:center}
  #vm-boot .mark{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:linear-gradient(135deg,#2543e6,#3b62f6);display:grid;place-items:center;box-shadow:0 12px 30px -10px rgba(37,67,230,.5)}
  #vm-boot .t{font-weight:800;font-size:18px;letter-spacing:-.02em}
  #vm-boot .s{color:#64748b;font-size:13px;margin-top:4px}
  #vm-boot .bar{width:180px;height:6px;border-radius:99px;background:#eef2f7;overflow:hidden;margin:16px auto 0}
  #vm-boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2543e6,#ffb838);transition:width .2s}
</style>
</head>
<body>
<div id="root"></div>
<div id="vm-boot"><div class="b">
  <div class="mark"><svg viewBox="0 0 24 24" width="26" height="26" fill="#fff"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.2l7.5 3.75L12 11.7 4.5 7.95 12 4.2z"/></svg></div>
  <div class="t">Visamotion</div>
  <div class="s">Loading your app...</div>
  <div class="bar"><i id="vm-prog"></i></div>
</div></div>
<script>
(async function () {
  var boot = document.getElementById("vm-boot");
  var prog = document.getElementById("vm-prog");
  var TOTAL = 3;
  var BASE = (function () {
    var p = window.location.pathname;
    var marker = "/visamotion-global-visa-intelligence";
    if (p.indexOf(marker) === 0) return marker + "/";
    return "./";
  })();
  try {
    var b64 = "";
    for (var i = 0; i < TOTAL; i++) {
      var url = BASE + "parts/part" + String(i).padStart(3, "0") + ".txt";
      var res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error("part " + i + " HTTP " + res.status);
      b64 += (await res.text()).trim();
      if (prog) prog.style.width = Math.round(((i + 1) / TOTAL) * 85) + "%";
    }
    var bin = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    var stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
    var html = await new Response(stream).text();
    var doc = new DOMParser().parseFromString(html, "text/html");
    // inject styles
    doc.querySelectorAll("style").forEach(function (s) {
      var st = document.createElement("style");
      st.textContent = s.textContent;
      document.head.appendChild(st);
    });
    doc.querySelectorAll('link[rel="stylesheet"]').forEach(function (l) {
      var ln = document.createElement("link");
      ln.rel = "stylesheet";
      ln.href = l.getAttribute("href");
      document.head.appendChild(ln);
    });
    // pull out the app module code
    var mod = doc.querySelector('script[type="module"]');
    var code = mod ? mod.textContent : "";
    if (!code) throw new Error("app module not found");
    if (prog) prog.style.width = "99%";
    var blob = new Blob([code], { type: "text/javascript" });
    var blobUrl = URL.createObjectURL(blob);
    await import(blobUrl);
    if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
  } catch (e) {
    if (boot) boot.innerHTML = '<div class="b"><div class="t">Could not load the app</div><div class="s">' +
      String(e).replace(/[<>&]/g, "") + "</div></div>";
    console.error(e);
  }
})();
</script>
</body>
</html>
